# Builds the Chud MAXXX APK for Fire TV (Fire TV Stick 4K Max and other Fire OS 7/8 devices).
# Separate from earlier CHUD STREAMS: application id app.dial.maxxx.
# Run it from the Actions tab ("Build Chud MAXXX for Fire TV" > Run workflow) or push to main/master.
# The APK appears under the run's "Artifacts" as chud-maxxx-apk.
#
# Optional but recommended: stable signing, so each new APK installs over the last one
# without losing your accounts and favourites. Add these repository secrets
# (Settings > Secrets and variables > Actions):
#   DIAL_KEYSTORE_BASE64    base64 of your .jks file
#   DIAL_KEYSTORE_PASSWORD
#   DIAL_KEY_ALIAS
#   DIAL_KEY_PASSWORD
# DIAL.md shows the two commands that create them.

name: Build Chud Supreme for Fire TV

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "mac/**"
      - ".github/workflows/mac.yml"
      - ".github/workflows/tv-screenshots.yml"
      - ".github/scripts/**"
      - "testing/mock-server/**"

permissions:
  contents: read

concurrency:
  group: chud-maxxx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Needed to publish the APK as a GitHub release (a stable download link for the Firestick).
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Restore signing key
        env:
          DIAL_KEYSTORE_BASE64: ${{ secrets.DIAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DIAL_KEYSTORE_BASE64" ]; then
            echo "$DIAL_KEYSTORE_BASE64" | base64 -d > dial-release.jks
            echo "DIAL_KEYSTORE_FILE=dial-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the Chud MAXXX release key."
          else
            echo "::warning::No DIAL_KEYSTORE_BASE64 secret. This APK uses a one-off debug key. Chud MAXXX still installs next to CHUD STREAMS because the application id is app.dial.maxxx, but a later MAXXX update will not install over this one until you add a fixed key."
          fi

      # Parser and test-server unit tests (quick, and they guard catalogue decoding).
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :parser:xtream:test :parser:m3u:test --console=plain 2>&1 | tee build.log

      - name: Build release APK
        shell: bash
        env:
          DIAL_KEYSTORE_PASSWORD: ${{ secrets.DIAL_KEYSTORE_PASSWORD }}
          DIAL_KEY_ALIAS: ${{ secrets.DIAL_KEY_ALIAS }}
          DIAL_KEY_PASSWORD: ${{ secrets.DIAL_KEY_PASSWORD }}
          CHUD_GITHUB_TOKEN: ${{ secrets.CHUD_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:tv:assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      # If the build fails, copy the important error lines into annotations, which show on the
      # run's summary page and through GitHub's API, so they can be read without the full log.
      - name: Summarise build errors
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          python3 - <<'PY'
          import re

          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          picked = []

          def add(line):
              line = line.rstrip()
              if line and line not in picked:
                  picked.append(line)

          # Gradle's explanation blocks: "* What went wrong:" up to "* Try:".
          for i, line in enumerate(lines):
              if line.startswith("* What went wrong"):
                  for follow in lines[i:i + 40]:
                      if follow.startswith("* Try"):
                          break
                      add(follow)
          # Compiler, resource and annotation-processor errors.
          patterns = (r"^e: ", r"^w: .*(unresolved|type mismatch)", r"error:", r"^ERROR:", r"AAPT: error", r"^> Task .*FAILED", r"FAILED$", r"Exception", r"expected:")
          for line in lines:
              if any(re.search(p, line) for p in patterns):
                  add(line)
          if not picked:
              picked = [l.rstrip() for l in lines[-80:]]

          picked = picked[:400]

          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          chunk = 45
          for n, start in enumerate(range(0, len(picked), chunk)):
              if n >= 9:
                  break
              body = "\n".join(line[:400] for line in picked[start:start + chunk])
              print(f"::error title=Build error details part {n + 1}::{escape(body)}")
          PY

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(ls app/tv/build/outputs/published-apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(ls app/tv/build/outputs/apk/release/*.apk | head -n 1)
          fi
          cp "$apk" "dist/chud-supreme-${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chud-supreme-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Every successful build on main is also published as a release, so the newest APK is
      # always at the same address, which can be typed straight into Downloader on the Fire TV:
      #   https://github.com/<owner>/<repo>/releases/latest/download/chud-maxxx.apk
      - name: Publish the APK for Downloader
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/*.apk chud-supreme.apk
          gh release create "build-${{ github.run_number }}" chud-supreme.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Chud Supreme build ${{ github.run_number }}" \
            --notes "Fire TV APK for Chud Supreme (app.dial.supreme). It installs next to Chud MAXXX. In Downloader, enter: https://github.com/${{ github.repository }}/releases/latest/download/chud-supreme.apk" \
            --latest
          echo "::notice::Download link for Downloader: https://github.com/${{ github.repository }}/releases/latest/download/chud-supreme.apk"
